<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow ring - breathing animation -->
  <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="26;28;26" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out"/>
    <animate attributeName="opacity" values="0.3;0.4;0.3" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </circle>

  <!-- Middle glow - secondary breathing -->
  <circle cx="32" cy="32" r="22" stroke="currentColor" stroke-width="3" opacity="0.5">
    <animate attributeName="r" values="20;22;20" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.1s"/>
    <animate attributeName="opacity" values="0.4;0.5;0.4" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.1s"/>
  </circle>

  <!-- Core glow - main breathing -->
  <circle cx="32" cy="32" r="16" fill="currentColor" opacity="0.6">
    <animate attributeName="r" values="14;16;14" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.2s"/>
    <animate attributeName="opacity" values="0.5;0.6;0.5" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.2s"/>
  </circle>

  <!-- Bright core - center -->
  <circle cx="32" cy="32" r="8" fill="currentColor" opacity="0.9">
    <animate attributeName="r" values="7;8;7" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.3s"/>
    <animate attributeName="opacity" values="0.8;0.9;0.8" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.3s"/>
  </circle>

  <!-- White hot center -->
  <circle cx="32" cy="32" r="4" fill="white" opacity="0.95">
    <animate attributeName="opacity" values="0.9;0.95;0.9" dur="1.5s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </circle>
</svg>

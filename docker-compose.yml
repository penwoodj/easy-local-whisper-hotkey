services:
  whisper-inference:
    build:
      context: .
      dockerfile: packaging/docker/Dockerfile.inference
    network_mode: none
    volumes:
      - ${XDG_RUNTIME_DIR}/whisper:/run/whisper
      - whisper-models:/models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    read_only: true
    restart: unless-stopped
    env_file:
      - .env

volumes:
  whisper-models:
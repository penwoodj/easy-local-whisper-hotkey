<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="micGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="32" cy="32" r="28" fill="url(#micGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Microphone body -->
  <rect x="26" y="18" width="12" height="20" rx="6" fill="white" filter="url(#glow)"/>
  
  <!-- Microphone base -->
  <path d="M24 40 Q32 44 40 40" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Sound waves/typing indicator -->
  <path d="M44 24 Q48 32 44 40" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M48 20 Q54 32 48 44" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 24 Q16 32 20 40" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M16 20 Q10 32 16 44" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
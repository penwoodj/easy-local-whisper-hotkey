name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag_exists: ${{ steps.tag_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Test before release
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v

      - id: version
        name: Resolve version
        run: |
          VERSION="$(
            python - <<'PY'
            from pathlib import Path

            namespace = {}
            exec(Path("src/whisper_hotkey/__init__.py").read_text(encoding="utf-8"), namespace)
            print(namespace["__version__"])
            PY
          )"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - id: tag_check
        name: Check for existing release tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distributions and bundle
        if: steps.tag_check.outputs.exists == 'false'
        run: ./scripts/build_release_assets.sh

      - name: Upload release artifacts
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

      - name: Release summary
        run: |
          {
            echo "## Release Gate"
            echo
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Existing tag: \`${{ steps.tag_check.outputs.exists }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-release:
    if: needs.build-release.outputs.tag_exists == 'false'
    needs:
      - build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE_NAME="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ needs.build-release.outputs.version }}"
          docker build -f packaging/docker/Dockerfile.inference -t "${IMAGE_NAME}:${VERSION}" -t "${IMAGE_NAME}:latest" .
          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"

  publish-release:
    if: needs.build-release.outputs.tag_exists == 'false'
    needs:
      - build-release
      - docker-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-release.outputs.version }}"
          gh release create "v${VERSION}" dist/* \
            --repo "${{ github.repository }}" \
            --generate-notes \
            --latest \
            --title "whisper-hotkey v${VERSION}" \
            --target "${GITHUB_SHA}"
